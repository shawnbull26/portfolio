<!doctype html>
<!--
  Source for public/og-image.jpg (1200×630). Regenerate on macOS with:
  "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --hide-scrollbars \
    --window-size=1200,630 --screenshot=og.png scripts/og-image.html
  then: sips -s format jpeg -s formatOptions 88 og.png --out public/og-image.jpg
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face { font-family: 'Archivo'; font-weight: 100 900; font-stretch: 62% 125%; src: url(../node_modules/@fontsource-variable/archivo/files/archivo-latin-wdth-normal.woff2); }
      @font-face { font-family: 'Inter Tight'; font-weight: 100 900; src: url(../node_modules/@fontsource-variable/inter-tight/files/inter-tight-latin-wght-normal.woff2); }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative; box-sizing: border-box; padding: 60px 72px;
        display: flex; flex-direction: column; justify-content: space-between;
        background: #0c0c0e; color: #f3f2ee; font-family: 'Inter Tight', sans-serif;
      }
      .grid { position: absolute; inset: 0;
        background-image: linear-gradient(to right, rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,.05) 1px, transparent 1px);
        background-size: 88px 88px; -webkit-mask-image: radial-gradient(ellipse 70% 70% at 40% 45%, black, transparent); }
      .glow { position: absolute; right: -260px; bottom: -380px; width: 900px; height: 900px; border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255,106,43,.38), transparent); }
      .row { position: relative; display: flex; justify-content: space-between; align-items: center; }
      .display { font-family: 'Archivo'; font-weight: 800; font-stretch: 115%; letter-spacing: -.045em; line-height: .95; }
      .mark { font-size: 30px; letter-spacing: -.04em; }
      .o { color: #ff6a2b; }
      .pill { border: 1px solid rgba(255,255,255,.14); border-radius: 999px; padding: 10px 18px; font-size: 17px; color: #a6a5a0; }
      .pill b { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #ff6a2b; margin-right: 10px; vertical-align: middle; }
      h1 { position: relative; margin: 0; font-size: 112px; }
      .foot { font-size: 21px; color: #a6a5a0; }
    </style>
  </head>
  <body>
    <div class="grid"></div><div class="glow"></div>
    <div class="row"><span class="display mark">Design by Dae<span class="o">.</span></span><span class="pill"><b></b>Founding rates from $697</span></div>
    <h1 class="display">No website yet?<br />Let’s get you <span class="o">found.</span></h1>
    <div class="row foot"><span>Websites for local businesses · Northern Virginia</span><span>Live in about a week</span></div>
  </body>
</html>
